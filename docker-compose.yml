name: mcp-geo-server

services:
  postgis:
    # Multi-arch by default (imresamu publishes amd64 + arm64) so it runs native
    # on Apple Silicon. The Makefile overrides POSTGIS_IMAGE per host arch.
    image: ${POSTGIS_IMAGE:-imresamu/postgis:16-3.4}
    container_name: mcp-geo-server-postgis
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: gis
      POSTGRES_PASSWORD: gis
    ports:
      # Host port configurable so the stack can coexist with another Postgres
      # (e.g. a second project) — set POSTGIS_HOST_PORT in .env to avoid clashes.
      - "${POSTGIS_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis -d gis"]
      interval: 5s
      timeout: 5s
      retries: 10

  geoserver:
    # Default = kartoza/geoserver (multi-arch: native arm64 on Apple Silicon).
    # The Makefile switches GEOSERVER_IMAGE + GEOSERVER_DATA_DIR per host arch
    # (e.g. the OSGeo image on amd64). The data-dir path differs between the two
    # distributions, so it is a variable used by BOTH the env and the mount.
    image: ${GEOSERVER_IMAGE:-kartoza/geoserver:2.28.0}
    container_name: mcp-geo-server-geoserver
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
      GEOSERVER_DATA_DIR: ${GEOSERVER_DATA_DIR:-/opt/geoserver/data_dir}
      # Let the browser-based test UI call the OGC services directly.
      CORS_ENABLED: "true"
    ports:
      # Configurable host port so this stack can run alongside another GeoServer
      # — set GEOSERVER_HOST_PORT in .env to avoid a clash (container stays 8080).
      - "${GEOSERVER_HOST_PORT:-8080}:8080"
    volumes:
      - gsdata:${GEOSERVER_DATA_DIR:-/opt/geoserver/data_dir}
      # Raster data (GeoTIFF / DTM) is registered as EXTERNAL coverage stores
      # pointing at file:/data/... — unlike vectors (pushed into PostGIS over the
      # network), GeoServer must read the raster file itself. Mounted read-only
      # at the SAME path the geo-init container uses, so the file: URL matches on
      # both sides. Zero-copy: the .tif stays on the host, not duplicated.
      - ./data:/data:ro
      # Preprocessed rasters (COGs built by geo-init when
      # GEO_INIT_RASTER_PREPROCESS=true) live here — GeoServer reads them too.
      - ./data-processed:/data-processed:ro

  # NOTE: no `ollama` service — the stack always uses a HOST Ollama (reachable at
  # host.docker.internal:11434), Ollama Cloud, or Anthropic, selected via
  # GEO_LLM_PROVIDER. Run `ollama serve` + `ollama pull <model>` on the host.

  # One-shot data initialiser: loads EVERY shapefile under ./data into PostGIS
  # and publishes each as a GeoServer layer, then exits. Fully idempotent — it
  # is safe to leave in the stack; re-running just skips what already exists.
  # Toggle with GEO_INIT_ENABLE=false. Transversal: no assumption about folder
  # names; whatever *.shp it finds, it loads.
  geo-init:
    build:
      context: .
      target: bootstrap
    image: mcp-geo-server:bootstrap
    container_name: mcp-geo-server-init
    restart: "no"
    depends_on:
      postgis:
        condition: service_healthy
      geoserver:
        condition: service_started
    environment:
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_USER: admin
      GEOSERVER_PASSWORD: geoserver
      GEOSERVER_DEFAULT_SRS: EPSG:4326
      # PostGIS connection (reachable from both this container and GeoServer).
      POSTGIS_HOST: postgis
      POSTGIS_PORT: "5432"
      POSTGIS_DB: gis
      POSTGIS_USER: gis
      POSTGIS_PASSWORD: gis
      # Bootstrap behaviour (all optional — sensible defaults baked in).
      GEO_INIT_ENABLE: ${GEO_INIT_ENABLE:-true}
      GEO_INIT_DATA_DIR: /data
      GEO_INIT_WORKSPACE: ${GEO_INIT_WORKSPACE:-ispra}
      GEO_INIT_DATASTORE: ${GEO_INIT_DATASTORE:-ispra_pg}
      GEO_INIT_TARGET_SRS: ${GEO_INIT_TARGET_SRS:-EPSG:4326}
      GEO_INIT_SOURCE_SRS: ${GEO_INIT_SOURCE_SRS:-}
      GEO_INIT_FORCE: ${GEO_INIT_FORCE:-false}
      GEO_INIT_SHAPE_ENCODING: ${GEO_INIT_SHAPE_ENCODING:-ISO-8859-1}
      # Raster (GeoTIFF / DTM) publishing: every *.tif/*.tiff under /data is
      # registered as an external coverage store. GeoServer reads it via the
      # shared ./data mount (see the geoserver service). Rasters land in the
      # same workspace as the vectors by default.
      GEO_INIT_RASTER_ENABLE: ${GEO_INIT_RASTER_ENABLE:-true}
      GEO_INIT_RASTER_WORKSPACE: ${GEO_INIT_RASTER_WORKSPACE:-}
      # Comma-separated globs (relative to /data) to limit which rasters are
      # published, e.g. GEO_INIT_RASTER_EXCLUDE=dtm/*,clc2018_it/*.
      GEO_INIT_RASTER_INCLUDE: ${GEO_INIT_RASTER_INCLUDE:-}
      GEO_INIT_RASTER_EXCLUDE: ${GEO_INIT_RASTER_EXCLUDE:-}
      # COG preprocessing (overviews). Off by default: rewriting a large DTM is
      # slow and doubles disk. Turn on for big rasters so WMS stays fast.
      GEO_INIT_RASTER_PREPROCESS: ${GEO_INIT_RASTER_PREPROCESS:-false}
      GEO_INIT_RASTER_PROCESSED_DIR: /data-processed
      GEO_INIT_STYLES: ${GEO_INIT_STYLES:-true}
      GEO_INIT_AI_METADATA: ${GEO_INIT_AI_METADATA:-false}
      GEO_AI_METADATA_LANGUAGE: ${GEO_AI_METADATA_LANGUAGE:-Italian}
      # LLM backend, used only when GEO_INIT_AI_METADATA=true (same knobs as
      # the webui / mcp services).
      GEO_LLM_PROVIDER: ${GEO_LLM_PROVIDER:-ollama}
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-${OLLAMA_MODEL:-qwen2.5}}
      OLLAMA_CLOUD_HOST: ${OLLAMA_CLOUD_HOST:-https://ollama.com}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Thematic style config, read from the mounted ./data dir. Edit
      # data/styles.yml to restyle for any domain (falls back to the packaged
      # ISPRA default if the file is missing).
      GEO_STYLES_CONFIG: ${GEO_STYLES_CONFIG:-/data/styles.yml}
    volumes:
      - ./data:/data:ro
      # Writable output for COG preprocessing (shared read-only with GeoServer).
      - ./data-processed:/data-processed

  # Web UI (FastAPI + Leaflet). Built from the `bootstrap` stage so it has GDAL
  # (ogr2ogr) + psql for shapefile upload/ingestion, and reaches the LLM for the
  # natural-language "show me ..." command (POST /api/ask).
  webui:
    build:
      context: .
      target: bootstrap
    image: mcp-geo-server:bootstrap
    container_name: mcp-geo-server-webui
    # Override the bootstrap stage CMD: serve the FastAPI UI instead.
    # NOTE: $$ escapes compose interpolation so the CONTAINER shell expands
    # WEBUI_PORT at runtime (not docker compose at parse time).
    command: ["sh", "-c", "uvicorn webui.app:app --host 0.0.0.0 --port 8000"]
    depends_on:
      geoserver:
        condition: service_started
    environment:
      GEOSERVER_URL: http://geoserver:8080/geoserver
      # Browser-facing URL for WMS/legend in the UI (the container hostname is
      # not reachable from the user's browser). Override if GeoServer is exposed
      # on a different host/port.
      GEOSERVER_PUBLIC_URL: ${GEOSERVER_PUBLIC_URL:-http://localhost:8080/geoserver}
      GEOSERVER_USER: admin
      GEOSERVER_PASSWORD: geoserver
      GEOSERVER_DEFAULT_SRS: EPSG:4326
      WEBUI_PORT: "8000"
      GEO_MAP_OUTPUT_DIR: /app/maps
      # PostGIS target for UI shapefile uploads (own workspace/datastore).
      POSTGIS_HOST: postgis
      POSTGIS_PORT: "5432"
      POSTGIS_DB: gis
      POSTGIS_USER: gis
      POSTGIS_PASSWORD: gis
      GEO_UPLOAD_WORKSPACE: ${GEO_UPLOAD_WORKSPACE:-uploads}
      GEO_UPLOAD_DATASTORE: ${GEO_UPLOAD_DATASTORE:-uploads_pg}
      # LLM backend for the natural-language command (same knobs as the mcp svc).
      GEO_LLM_PROVIDER: ${GEO_LLM_PROVIDER:-ollama}
      # Containers always reach the HOST Ollama via host.docker.internal — the
      # OLLAMA_HOST in your .env.local (often localhost) is for host-side runs.
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-${OLLAMA_MODEL:-qwen2.5}}
      OLLAMA_CLOUD_HOST: ${OLLAMA_CLOUD_HOST:-https://ollama.com}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Terrain enrichment reads the DTM raster FILE directly (not WMS). The DTM
      # is referenced by its COVERAGE LAYER name and the file path is resolved
      # from GeoServer at runtime (works for ANY published DTM). GEO_DTM_PATH is
      # only an optional explicit override / fallback when no layer is given.
      GEO_DTM_PATH: ${GEO_DTM_PATH:-}
      # Optional access control (see webui/security.py): Basic auth on every
      # route when BOTH are set; per-IP requests/minute on the LLM routes.
      WEBUI_USER: ${WEBUI_USER:-}
      WEBUI_PASSWORD: ${WEBUI_PASSWORD:-}
      WEBUI_RATE_LIMIT: ${WEBUI_RATE_LIMIT:-30}
      GEO_CATALOG_TTL: ${GEO_CATALOG_TTL:-60}
      GEO_RESOLVER_STRUCTURED: ${GEO_RESOLVER_STRUCTURED:-true}
      # Domain config (filterable attributes, admin levels) for the resolver:
      # the same file geo-init styles with, so a custom data/styles.yml applies
      # to the chat too (falls back to the packaged default if missing).
      GEO_STYLES_CONFIG: ${GEO_STYLES_CONFIG:-/data/styles.yml}
      GEO_RETRIEVAL: ${GEO_RETRIEVAL:-true}
      GEO_RETRIEVAL_MIN_CATALOG: ${GEO_RETRIEVAL_MIN_CATALOG:-40}
      GEO_LLM_FALLBACK_PROVIDER: ${GEO_LLM_FALLBACK_PROVIDER:-}
      GEO_LLM_FALLBACK_MODEL: ${GEO_LLM_FALLBACK_MODEL:-}
      GEO_LLM_CONFIDENCE_MIN: ${GEO_LLM_CONFIDENCE_MIN:-0.5}
      GEO_PROMPT_CACHE: ${GEO_PROMPT_CACHE:-false}
      GEO_UPLOAD_AI_METADATA: ${GEO_UPLOAD_AI_METADATA:-false}
      GEO_AI_METADATA_LANGUAGE: ${GEO_AI_METADATA_LANGUAGE:-Italian}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      # Configurable host port so the UI can run beside another app on :8000 —
      # set WEBUI_HOST_PORT in .env (container always serves on 8000).
      - "${WEBUI_HOST_PORT:-8000}:8000"
    volumes:
      # The enrichment reads the DTM file directly (GDAL), so the UI needs it
      # mounted (read-only), like the geo-init/geoserver services.
      - ./data:/data:ro
      - ./data-processed:/data-processed:ro

  # Intelligent MCP server: GeoServer agent (Microsoft Agent Framework) exposed
  # over streamable-HTTP at http://localhost:9000/mcp. Visible, long-lived.
  mcp:
    build: .
    image: mcp-geo-server:latest
    container_name: mcp-geo-server-mcp
    command: ["python", "-m", "mcp_geo_server.server"]
    # Only GeoServer is a hard dependency. The LLM backend (host Ollama, Ollama
    # Cloud or Anthropic) is reached lazily over the network via GEO_LLM_PROVIDER,
    # so it must not gate startup.
    depends_on:
      geoserver:
        condition: service_started
    environment:
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_USER: admin
      GEOSERVER_PASSWORD: geoserver
      GEOSERVER_DEFAULT_SRS: EPSG:4326
      # LLM provider: ollama (host, default) | ollama-cloud | anthropic
      GEO_LLM_PROVIDER: ${GEO_LLM_PROVIDER:-ollama}
      # Containers reach the HOST Ollama via host.docker.internal (see webui).
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-${OLLAMA_MODEL:-qwen2.5}}
      OLLAMA_CLOUD_HOST: ${OLLAMA_CLOUD_HOST:-https://ollama.com}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEO_MCP_TRANSPORT: http
      # Open bind inside the container (the app default is 127.0.0.1); the
      # port mapping below decides what the host exposes.
      GEO_MCP_HOST: 0.0.0.0
      GEO_MCP_PORT: "9000"
      GEO_MCP_MODE: ${GEO_MCP_MODE:-tools}
      GEO_MCP_AGENT_TOOL: ${GEO_MCP_AGENT_TOOL:-true}
      # DNS-rebinding protection on the open bind: the Host header must match.
      # Add the name your MCP clients use (e.g. a reverse-proxy host).
      GEO_MCP_ALLOWED_HOSTS: ${GEO_MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*,mcp:*}
      GEO_MCP_ALLOWED_ORIGINS: ${GEO_MCP_ALLOWED_ORIGINS:-}
      # Remote MCP servers whose tools the geoserver-agent may use, as
      # name=url pairs (e.g. idrogeo=http://idrogeo-mcp:8767/mcp). Unreachable
      # ones are logged and skipped; empty = local tools only.
      GEO_EXTRA_MCP_SERVERS: ${GEO_EXTRA_MCP_SERVERS:-}
      GEO_EXTRA_MCP_TIMEOUT: ${GEO_EXTRA_MCP_TIMEOUT:-10}
      GEO_EXTRA_MCP_INSTRUCTIONS: ${GEO_EXTRA_MCP_INSTRUCTIONS:-}
      # geo_resolve_request uses the same domain config as the chat.
      GEO_STYLES_CONFIG: ${GEO_STYLES_CONFIG:-/data/styles.yml}
      GEO_ALLOW_DESTRUCTIVE: ${GEO_ALLOW_DESTRUCTIVE:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      GEO_MAP_OUTPUT_DIR: /app/maps
      # DTM referenced by coverage layer; GEO_DTM_PATH is an optional override.
      GEO_DTM_PATH: ${GEO_DTM_PATH:-}
    ports:
      # Configurable host port so the MCP server can run beside another on :9000
      # — set MCP_HOST_PORT in .env (container always serves on 9000).
      - "${MCP_HOST_PORT:-9000}:9000"
    volumes:
      # The geo_enrich_from_dtm tool reads the DTM file directly (GDAL), so the
      # agent server needs the raster data mounted (read-only).
      - ./data:/data:ro
      - ./data-processed:/data-processed:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; socket.create_connection(('127.0.0.1', 9000), timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pgdata:
  gsdata:
