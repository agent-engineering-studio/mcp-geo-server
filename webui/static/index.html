<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mcp-geo-server — chat & mappa</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    body { display: flex; height: 100vh; }

    /* Left: chat (half). Right: map (half). */
    #chat { width: 42%; max-width: 560px; display: flex; flex-direction: column;
      border-right: 1px solid #ddd; background: #f7f8fa; }
    #map { flex: 1; }

    header { padding: 12px 14px; border-bottom: 1px solid #e3e3e3; background: #fff;
      display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    header h1 { font-size: 16px; margin: 0; }
    header .sub { font-size: 11px; color: #777; }
    header a { font-size: 13px; color: #2563eb; text-decoration: none; white-space: nowrap; }
    #status { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
    #status.ok { background: #dcfce7; color: #166534; }
    #status.bad { background: #fee2e2; color: #991b1b; }

    #messages { flex: 1; overflow-y: auto; padding: 14px; display: flex;
      flex-direction: column; gap: 10px; }
    .msg { max-width: 88%; padding: 8px 11px; border-radius: 12px; font-size: 14px;
      line-height: 1.35; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 3px; }
    .msg.bot { align-self: flex-start; background: #fff; border: 1px solid #e3e3e3; border-bottom-left-radius: 3px; }
    .msg.bot .layers { margin-top: 6px; font-size: 12px; color: #555; }
    .msg.bot .layers code { background: #eef; padding: 1px 4px; border-radius: 3px; }
    .msg.err { align-self: flex-start; background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .hint { align-self: center; color: #999; font-size: 12px; text-align: center; }

    #composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e3e3e3; background: #fff; }
    #composer input { flex: 1; padding: 9px 11px; font-size: 14px; border: 1px solid #ccc; border-radius: 8px; }
    #composer button { padding: 9px 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }
    #composer button:disabled { background: #9bb4ef; cursor: default; }

    #legend { position: absolute; right: 12px; bottom: 12px; z-index: 1000;
      background: rgba(255,255,255,0.94); border: 1px solid #ccc; border-radius: 6px;
      padding: 8px 10px; max-width: 280px; max-height: 60vh; overflow-y: auto;
      font-size: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.2); display: none; }
    #legend h4 { margin: 0 0 6px; font-size: 12px; }
    #legend .leg-layer { margin-bottom: 8px; }
    #legend .leg-layer b { display: block; font-size: 11px; color: #333; margin-bottom: 2px; word-break: break-all; }
    #legend img { display: block; max-width: 100%; }
  </style>
</head>
<body>
  <div id="chat">
    <header>
      <div>
        <h1>🗺️ Assistente GeoServer</h1>
        <div class="sub">Chiedi in linguaggio naturale e i dati appaiono sulla mappa</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <a href="/upload">⬆️ Carica shapefile</a>
        <span id="status" class="bad">…</span>
      </div>
    </header>

    <div id="messages">
      <div class="hint">Esempi: «mostrami le frane lineari del Molise» · «i comuni d'Italia» · «pericolosità da frana in Campania»</div>
    </div>

    <div id="composer">
      <input id="q" placeholder="Scrivi qui…" autocomplete="off"
             onkeydown="if(event.key==='Enter')send()" />
      <button id="sendbtn" onclick="send()">Invia</button>
    </div>
  </div>

  <div id="map"></div>
  <div id="legend"></div>

  <script>
    let CONFIG = { wms_base: "" };
    const map = L.map("map").setView([42, 12.5], 6);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    const wmsLayers = {};
    const enc = encodeURIComponent;

    async function api(path, opts) {
      const res = await fetch(path, opts);
      const text = await res.text();
      let data; try { data = JSON.parse(text); } catch { data = text; }
      if (!res.ok) throw new Error(typeof data === "object" ? (data.detail || text) : text);
      return data;
    }

    async function checkStatus() {
      const el = document.getElementById("status");
      try {
        const s = await api("/api/status");
        CONFIG = await api("/api/config");
        if (s.connected) { el.className = "ok"; el.textContent = "connesso"; }
        else { el.className = "bad"; el.textContent = "non connesso"; }
      } catch (e) { el.className = "bad"; el.textContent = "non connesso"; }
    }

    // ---- map helpers ----
    function clearWms() {
      Object.values(wmsLayers).forEach(l => map.removeLayer(l));
      Object.keys(wmsLayers).forEach(k => delete wmsLayers[k]);
    }
    function addWmsQualified(qualified, cql, clip, zIndex) {
      // Larger tiles + update-when-idle reduce the burst of concurrent tile
      // requests (which GeoServer can transiently throttle with 429).
      const params = { layers: qualified, format: "image/png", transparent: true,
        version: "1.1.1", tileSize: 512, updateWhenIdle: true, crossOrigin: true };
      if (cql) params.cql_filter = cql;
      // clip = "SRID=4326;<WKT>" of an admin unit (comune/provincia/regione):
      // GeoServer clips the rendered output to that polygon, reprojecting from
      // 4326 to the tile CRS. Leaflet URL-encodes it into the tile requests.
      if (clip) params.clip = clip;
      // Explicit stacking: rasters get a low zIndex (drawn at the bottom),
      // vectors a higher one, so an opaque raster never hides the vectors.
      if (zIndex != null) params.zIndex = zIndex;
      wmsLayers[qualified] = L.tileLayer.wms(CONFIG.wms_base, params).addTo(map);
    }
    function zoomToBbox(b) {
      if (!b) return;
      const bounds = L.latLngBounds([[b.miny, b.minx], [b.maxy, b.maxx]]);
      if (bounds.isValid()) map.fitBounds(bounds);
    }
    function renderLegend() {
      const box = document.getElementById("legend");
      const active = Object.keys(wmsLayers);
      if (!active.length) { box.style.display = "none"; box.innerHTML = ""; return; }
      let html = "<h4>Legenda</h4>";
      active.forEach(q => {
        const url = CONFIG.wms_base + "?service=WMS&version=1.1.1&request=GetLegendGraphic" +
          "&format=image/png&layer=" + enc(q) +
          "&legend_options=" + enc("forceLabels:on;fontAntiAliasing:true;fontName:sans");
        html += `<div class="leg-layer"><b>${q}</b><img src="${url}" alt="legend ${q}"></div>`;
      });
      box.innerHTML = html;
      box.style.display = "block";
    }

    // ---- chat ----
    const messages = document.getElementById("messages");
    function bubble(cls, html) {
      const d = document.createElement("div");
      d.className = "msg " + cls;
      d.innerHTML = html;
      messages.appendChild(d);
      messages.scrollTop = messages.scrollHeight;
      return d;
    }
    const escapeHtml = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

    async function send() {
      const input = document.getElementById("q");
      const q = input.value.trim();
      if (!q) return;
      const btn = document.getElementById("sendbtn");
      input.value = "";
      bubble("user", escapeHtml(q));
      btn.disabled = true;
      const thinking = bubble("bot", "…");
      try {
        const r = await api("/api/ask", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: q })
        });
        if (!r.layers || !r.layers.length) {
          thinking.innerHTML = (r.explanation ? escapeHtml(r.explanation) + "<br>" : "") +
            "<i>Nessun layer corrispondente.</i>";
        } else {
          const info = {};
          (r.info || []).forEach(i => info[i.qualified] = i);
          // Split populated vs empty layers: only draw/describe the ones with
          // data; empty layers (e.g. a region with no records) are just noted,
          // so the answer stays coherent when several layers are returned.
          const populated = r.layers.filter(l => !info[l] || info[l].count !== 0);
          const empty = r.layers.filter(l => info[l] && info[l].count === 0);

          clearWms();
          // The server returns `layers` already in draw order (bottom -> top):
          // rasters below vectors, broadest raster lowest. We just render in
          // that order; zIndex mirrors it so the stacking is explicit. (populated
          // is r.layers filtered, so it preserves the server order.)
          populated.forEach((l, i) => addWmsQualified(l, r.cql_filter, r.clip, 300 + i));
          zoomToBbox(r.bbox);
          renderLegend();

          let html = escapeHtml(r.explanation || "Ecco i dati richiesti.");
          if (r.admin) html += ` <i>(ritagliato su ${escapeHtml(r.admin.level)} ${escapeHtml(r.admin.name)})</i>`;
          const descs = populated.map(l => {
            const i = info[l];
            if (!i) return "Dati vettoriali mostrati sulla mappa.";
            let s = `Sono <b>${i.geometry || "dati vettoriali"}</b>`;
            if (i.count != null) s += ` con <b>${i.count}</b> elementi`;
            s += ".";
            if (i.fields && i.fields.length)
              s += ` Attributi disponibili: ${i.fields.slice(0, 10).map(escapeHtml).join(", ")}.`;
            return s;
          });
          if (descs.length) html += `<div class="layers">${descs.join("<br>")}</div>`;
          if (!populated.length)
            html += `<div class="layers">Per quest'area non sono presenti dati da mostrare sulla mappa.</div>`;
          else if (empty.length)
            html += `<div class="layers"><small>Nota: ${empty.length} altro/i layer non contiene dati per quest'area e non è stato mostrato.</small></div>`;
          if (r.cql_filter) html += `<div class="layers"><small>Filtro applicato: ${escapeHtml(r.cql_filter)}</small></div>`;
          // Terrain enrichment: the server returns a display-ready `text`
          // (title + per-layer sentence), so we just print it.
          if (r.enrichment && r.enrichment.text) {
            const lines = r.enrichment.text.split("\n").map(escapeHtml);
            html += `<div class="layers"><b>${lines[0]}</b><br>${lines.slice(1).join("<br>")}</div>`;
          }
          thinking.innerHTML = html;
          thinking.title = r.layers.join(", ");  // technical names on hover only
        }
      } catch (e) {
        thinking.className = "msg err";
        thinking.textContent = "Errore: " + e.message;
      } finally {
        btn.disabled = false;
        input.focus();
      }
    }

    checkStatus();
  </script>
</body>
</html>
