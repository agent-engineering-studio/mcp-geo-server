name: Build & publish Docker images

# Builds and publishes the project images to the GitHub Container Registry
# (GHCR) on every push to main and on version tags. Two images are produced:
#   - <repo>:latest          the app image (web UI + MCP agent)
#   - <repo>:bootstrap       the data-init/web-UI image (adds GDAL + psql)
# Both are multi-arch (linux/amd64 + linux/arm64) so they run native on
# Apple Silicon and Intel.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,webui]"
      - name: Run tests
        run: pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Build & push app image (web UI + MCP agent)
        uses: docker/build-push-action@v6
        with:
          context: .
          # `base` is the lean app stage; `bootstrap` (the last stage) is built
          # separately below. Without target the last stage would be used.
          target: base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push bootstrap image (adds GDAL + psql)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: bootstrap
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:bootstrap
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:bootstrap-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
