[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-geo-server"
version = "0.1.0"
description = "MCP server (FastMCP) to drive a GeoServer instance: REST admin + OGC WMS/WFS/WFS-T + SLD styles, with a Leaflet test UI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Agent Engineering Studio" }]
dependencies = [
    # 1.24 is the first release whose as_mcp_server() runs on the mcp v2 SDK
    # (protocol 2026-07-28); older ones require mcp<2.
    "agent-framework>=1.24",
    # Bounded: a future mcp major must not land through a plain `pip install`
    # (the unbounded `mcp>=1.0` broke exactly that way when mcp 2.0 shipped).
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "jinja2>=3.1",
    "starlette>=0.37",
    "uvicorn>=0.29",
    "anyio>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
webui = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # Geometry simplification for the admin-area (comune/provincia/regione) clip
    # in the chat: the region polygon is simplified so its WKT fits in the WMS
    # tile GET URL.
    "shapely>=2.0",
    # On-demand terrain enrichment from a DTM (quota/slope/aspect/curvature):
    # windowed raster reads + zonal statistics.
    "rasterio>=1.3",
    "rasterstats>=0.19",
]

[project.scripts]
mcp-geo-server = "mcp_geo_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_geo_server = ["templates/*.j2", "styles_default.yml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Repo root on sys.path so tests can import the `webui` package.
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
